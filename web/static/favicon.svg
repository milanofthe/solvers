<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
<!-- The subject of the site as its mark: a Butcher tableau. Lower triangular, so
     it reads as a method that can be stepped one stage at a time, with the
     diagonal picked out because that entry is what decides whether a stage needs
     a solve at all. Four by four on the same grid the site's own favicon uses. -->
<rect width="16" height="16" fill="#0F0F0F"/>
<rect x="1.10" y="4.60" width="2.8" height="2.8" fill="#f0efe9"/>
<rect x="1.10" y="8.10" width="2.8" height="2.8" fill="#f0efe9"/>
<rect x="4.60" y="8.10" width="2.8" height="2.8" fill="#f0efe9"/>
<rect x="1.10" y="11.60" width="2.8" height="2.8" fill="#f0efe9"/>
<rect x="4.60" y="11.60" width="2.8" height="2.8" fill="#f0efe9"/>
<rect x="8.10" y="11.60" width="2.8" height="2.8" fill="#f0efe9"/>
<rect x="1.10" y="1.10" width="2.8" height="2.8" fill="#00D9C0"/>
<rect x="4.60" y="4.60" width="2.8" height="2.8" fill="#00D9C0"/>
<rect x="8.10" y="8.10" width="2.8" height="2.8" fill="#00D9C0"/>
<rect x="11.60" y="11.60" width="2.8" height="2.8" fill="#00D9C0"/>
</svg>
